[package]
name = "virt-manager-api"
version = "1.0.0"
edition = "2021"
description = "API REST de gestion des machines virtuelles via libvirt (auth, multi-hyperviseurs, stockage, console VNC, export IaC)"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
utoipa = { version = "5", features = ["axum_extras"] }
virt = "0.4.3"
uuid = { version = "1", features = ["v4"] }
roxmltree = "0.20"
xmltree = "0.11"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
